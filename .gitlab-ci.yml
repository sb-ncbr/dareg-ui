image: node:24-alpine

stages:
  - build
  - publish
  - review
  - staging
  - production
  - cleanup

variables:
  DOCKER_IMAGE_NAME: "$HARBOR_URL/ceitec-biodata/dareg-ui"
  CLUSTER_DOMAIN: "dyn.cloud.e-infra.cz"
  DEPLOYMENT_TLD: dareg.${CLUSTER_DOMAIN}
  DEPLOYMENT_TLD_FIX: "dareg.biodata.ceitec.cz"
  K8S_AGENT_NAME: agent-dareg
  K8S_NAMESPACE: ceitec-dareg-ns

  # Application Environment Variables
  NEXT_PUBLIC_API_URL: "https://api.dareg.biodata.ceitec.cz"
  NEXT_PUBLIC_APP_NAME: "DAREG UI"
  NEXT_PUBLIC_APP_VERSION: "${CI_COMMIT_SHORT_SHA}"
  NEXT_PUBLIC_APP_ENVIRONMENT: "${CI_ENVIRONMENT_NAME}"

  # OIDC Authentication Variables (placeholders for build, real values at runtime)
  NEXT_PUBLIC_AUTH_OIDC_ISSUER: "PLACEHOLDER_OIDC_ISSUER"
  NEXT_PUBLIC_AUTH_OIDC_CLIENT_ID: "PLACEHOLDER_OIDC_CLIENT_ID"
  NEXT_PUBLIC_APP_OIDC_METADATA_ISSUER: "PLACEHOLDER_OIDC_METADATA_ISSUER"
  NEXT_PUBLIC_APP_OIDC_METADATA_AUTHORIZATION_ENDPOINT: "PLACEHOLDER_OIDC_AUTHORIZATION_ENDPOINT"
  NEXT_PUBLIC_APP_OIDC_METADATA_TOKEN_ENDPOINT: "PLACEHOLDER_OIDC_TOKEN_ENDPOINT"
  NEXT_PUBLIC_APP_OIDC_METADATA_USERINFO_ENDPOINT: "PLACEHOLDER_OIDC_USERINFO_ENDPOINT"
  NEXT_PUBLIC_APP_OIDC_SCOPE: "PLACEHOLDER_OIDC_SCOPE"

cache:
  key:
    files:
      - package.json
      - pnpm-lock.yaml
  paths:
    - $CI_PROJECT_DIR/.npm/
    - $CI_PROJECT_DIR/node_modules
  policy: pull-push

.normalize_branch_name: &normalize_branch_name |
  export NORMALIZED_BRANCH_NAME=$(echo "$CI_COMMIT_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
  echo "Normalized branch name: $NORMALIZED_BRANCH_NAME"

