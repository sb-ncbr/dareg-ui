#       - npm ci --cache .npm --prefer-offline
#     script:
#       - npm run test
#     needs: ["eslint"]

# eslint:
#     stage: lint
#     before_script:
#       - npm ci --cache .npm --prefer-offline
#     script:
#       - npm run lint

build_app:
  stage: build
  before_script:
    - apk add --no-cache git
    - corepack enable && corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile
  script:
    - unset CI #This will need to be fixed + add test beforehand
    - pnpm run build
  artifacts:
    paths:
      - $CI_PROJECT_DIR/.next/
      - $CI_PROJECT_DIR/public/
    expire_in: 2 hours
  except:
    - tags
  # needs: ["unit test"]

build_image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  before_script:
    - echo "{\"auths\":{\"${HARBOR_URL}\":{\"auth\":\"$(printf "%s:%s" "${HUB_REGISTRY_USER}" "${HARBOR_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  #   - docker login -u $HUB_REGISTRY_USER -p $HARBOR_PASSWORD $HARBOR_URL
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}"
      --build-arg NEXT_PUBLIC_APP_NAME="${NEXT_PUBLIC_APP_NAME}"
      --build-arg NEXT_PUBLIC_APP_VERSION="${NEXT_PUBLIC_APP_VERSION}"
      --build-arg NEXT_PUBLIC_APP_ENVIRONMENT="${NEXT_PUBLIC_APP_ENVIRONMENT}"
      --build-arg NEXT_PUBLIC_AUTH_OIDC_ISSUER="${NEXT_PUBLIC_AUTH_OIDC_ISSUER}"
      --build-arg NEXT_PUBLIC_AUTH_OIDC_CLIENT_ID="${NEXT_PUBLIC_AUTH_OIDC_CLIENT_ID}"
      --build-arg NEXT_PUBLIC_APP_OIDC_METADATA_ISSUER="${NEXT_PUBLIC_APP_OIDC_METADATA_ISSUER}"
      --build-arg NEXT_PUBLIC_APP_OIDC_METADATA_AUTHORIZATION_ENDPOINT="${NEXT_PUBLIC_APP_OIDC_METADATA_AUTHORIZATION_ENDPOINT}"
      --build-arg NEXT_PUBLIC_APP_OIDC_METADATA_TOKEN_ENDPOINT="${NEXT_PUBLIC_APP_OIDC_METADATA_TOKEN_ENDPOINT}"
      --build-arg NEXT_PUBLIC_APP_OIDC_METADATA_USERINFO_ENDPOINT="${NEXT_PUBLIC_APP_OIDC_METADATA_USERINFO_ENDPOINT}"
      --build-arg NEXT_PUBLIC_APP_OIDC_SCOPE="${NEXT_PUBLIC_APP_OIDC_SCOPE}"
    # - docker build --tag $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA --tag latest --tag $CI_COMMIT_REF_SLUG -f $CI_PROJECT_DIR/Dockerfile .
    # - docker push --all-tags $DOCKER_IMAGE_NAME
  except:
    - tags

.deploy: &deploy
  image:
    name: zhangsean/kubectl
    entrypoint: [""]
  before_script:
    - kubectl config use-context $(kubectl config get-contexts -o=name | grep ${K8S_AGENT_NAME})
  script:
    - mkdir -p $CI_PROJECT_DIR/manifests/prepared/$APP_COMPONENT || true
    - cd $CI_PROJECT_DIR/manifests
    - for f in $APP_COMPONENT/*.yaml; do envsubst < $f > prepared/$f; done
    - ls -la prepared/$APP_COMPONENT || true
    - cat prepared/$APP_COMPONENT/*.yaml || true
    - kubectl apply -f prepared/$APP_COMPONENT --recursive -n ${K8S_NAMESPACE}
  artifacts:
    name: deployments-$CI_COMMIT_REF_SLUG
    paths:
      - $CI_PROJECT_DIR/manifests/prepared/$APP_COMPONENT
    expire_in: 1 week

