dev:
  <<: *deploy
  stage: review
  variables:
    APP_COMPONENT: web
    APP_ID: dev
    APP: dev
    APP_HOST: devel.${DEPLOYMENT_TLD}
    APP_HOST_FIX: devel.${DEPLOYMENT_TLD_FIX}
    # Override OIDC placeholders with actual dev values
    NEXT_PUBLIC_AUTH_OIDC_ISSUER: "${OIDC_ISSUER}"
    NEXT_PUBLIC_AUTH_OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
    NEXT_PUBLIC_APP_OIDC_METADATA_ISSUER: "${OIDC_METADATA_ISSUER}"
    NEXT_PUBLIC_APP_OIDC_METADATA_AUTHORIZATION_ENDPOINT: "${OIDC_AUTHORIZATION_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_METADATA_TOKEN_ENDPOINT: "${OIDC_TOKEN_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_METADATA_USERINFO_ENDPOINT: "${OIDC_USERINFO_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_SCOPE: "${OIDC_SCOPE}"
  environment:
    name: dev
    url: https://devel.${DEPLOYMENT_TLD_FIX}
    on_stop: stop-dev
  only:
    - branches
  except:
    - master

staging:
  <<: *deploy
  stage: staging
  variables:
    APP_COMPONENT: web
    APP_ID: staging
    APP: staging
    APP_HOST: stage.${DEPLOYMENT_TLD}
    APP_HOST_FIX: stage.${DEPLOYMENT_TLD_FIX}
    # Override OIDC placeholders with actual staging values
    NEXT_PUBLIC_AUTH_OIDC_ISSUER: "${OIDC_ISSUER}"
    NEXT_PUBLIC_AUTH_OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
    NEXT_PUBLIC_APP_OIDC_METADATA_ISSUER: "${OIDC_METADATA_ISSUER}"
    NEXT_PUBLIC_APP_OIDC_METADATA_AUTHORIZATION_ENDPOINT: "${OIDC_AUTHORIZATION_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_METADATA_TOKEN_ENDPOINT: "${OIDC_TOKEN_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_METADATA_USERINFO_ENDPOINT: "${OIDC_USERINFO_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_SCOPE: "${OIDC_SCOPE}"
  environment:
    name: staging
    url: https://stage.${DEPLOYMENT_TLD_FIX}
  only:
    - master

production:
  <<: *deploy
  stage: production
  variables:
    APP_COMPONENT: web
    APP_ID: production
    APP: production
    APP_HOST: ${DEPLOYMENT_TLD}
    APP_HOST_FIX: ${DEPLOYMENT_TLD_FIX}
    # Override OIDC placeholders with actual production values
    NEXT_PUBLIC_AUTH_OIDC_ISSUER: "${OIDC_ISSUER}"
    NEXT_PUBLIC_AUTH_OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
    NEXT_PUBLIC_APP_OIDC_METADATA_ISSUER: "${OIDC_METADATA_ISSUER}"
    NEXT_PUBLIC_APP_OIDC_METADATA_AUTHORIZATION_ENDPOINT: "${OIDC_AUTHORIZATION_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_METADATA_TOKEN_ENDPOINT: "${OIDC_TOKEN_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_METADATA_USERINFO_ENDPOINT: "${OIDC_USERINFO_ENDPOINT}"
    NEXT_PUBLIC_APP_OIDC_SCOPE: "${OIDC_SCOPE}"
  when: manual
  environment:
    name: production
    url: https://${DEPLOYMENT_TLD_FIX}
  only:
    - tags
  except:
    - branches

stop-dev:
  <<: *deploy
  stage: cleanup
  script:
    - echo "All cluster resources within the namespace ${K8S_NAMESPACE} with label 'deployment-id=$APP' will be removed" || true
    - kubectl delete deployments,services,ingresses,configmaps,secrets -n ${K8S_NAMESPACE} -l deployment-id=$APP
  when: manual
  variables:
    APP: dev
    GIT_STRATEGY: none
  environment:
    name: dev
    action: stop
  only:
    - branches
  except:
    - master

stop-review:
  <<: *deploy
  stage: cleanup
  script:
    - echo "All cluster resources within the namespace ${K8S_NAMESPACE} with label 'deployment-id=$APP' will be removed" || true
    - kubectl delete deployments,services,ingresses,configmaps,secrets -n ${K8S_NAMESPACE} -l deployment-id=$APP
  when: manual
  variables:
    APP: review
    GIT_STRATEGY: none
  environment:
    name: review
    action: stop
  only:
    - branches
  except:
    - master
